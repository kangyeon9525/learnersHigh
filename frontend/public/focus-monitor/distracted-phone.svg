<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="시선이 화면에서 벗어남 (휴대폰)">
  <defs>
    <linearGradient id="dp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2230"/>
      <stop offset="100%" stop-color="#130f16"/>
    </linearGradient>
    <radialGradient id="dp-phone" cx="62%" cy="62%" r="26%">
      <stop offset="0%" stop-color="#9fe0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9fe0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dp-vig" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#dp-bg)"/>
  <rect width="640" height="480" fill="url(#dp-phone)"/>

  <!-- 데스크 -->
  <rect x="80" y="356" width="480" height="124" fill="#1d1822"/>

  <!-- 고개 숙이고 휴대폰 보는 인물 -->
  <ellipse cx="300" cy="214" rx="56" ry="66" fill="#cda07a" transform="rotate(16 300 214)"/>
  <path d="M250 226 Q300 150 358 200 L352 262 Q300 244 262 274 Z" fill="#2f261d"/>
  <rect x="234" y="276" width="180" height="80" rx="22" fill="#5a4a5e"/>

  <!-- 휴대폰 (빛나는 화면) -->
  <rect x="372" y="300" width="48" height="84" rx="9" fill="#0e0e14" transform="rotate(-18 396 342)"/>
  <rect x="380" y="310" width="32" height="64" rx="4" fill="#9fe0ff" opacity="0.85" transform="rotate(-18 396 342)"/>

  <rect width="640" height="480" fill="url(#dp-vig)"/>
</svg>
